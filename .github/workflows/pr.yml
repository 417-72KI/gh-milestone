name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]
    paths:
      - '.github/workflows/pr.yml'
      - '.goreleaser.yml'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - id: diff
        name: Fetch Diff
        run: echo result=$(gh pr view ${{ github.event.number }} --json files --jq '.files | map(.path)' | jq -rc .) >> $GITHUB_OUTPUT
      - if: ${{ contains(fromJSON(steps.diff.outputs.result), '.goreleaser.yml') }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          install-only: true
      - if: ${{ contains(fromJSON(steps.diff.outputs.result), '.goreleaser.yml') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser check
      - name: Install
        run: make install
      - name: Test list
        run: gh milestone list
      - name: Test view
        run: gh milestone view 1
